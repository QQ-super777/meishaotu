<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="美少兔食堂">
<meta name="theme-color" content="#fff6fa">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<title>美少兔食堂</title>
<style>
:root{
  --card:#ffffff; --ink:#6a4c56; --ink2:#b193a0; --ink3:#d6bfc8;
  --pink:#ffdde7; --blue:#d8e8ff; --cream:#fff0cd; --apricot:#ffe1d2;
  --hot:#ff9cb8; --hot2:#ff85a8;
  --grid:rgba(255,171,201,.22);
  --r:26px;
  --sh:0 5px 15px rgba(255,150,180,.18);
  --sh2:0 8px 22px rgba(255,150,180,.24);
  --shup:0 -3px 16px rgba(255,150,180,.13);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--ink);min-height:100vh;
  background:
    repeating-linear-gradient(0deg,transparent 0 27px,var(--grid) 27px 29px),
    repeating-linear-gradient(90deg,transparent 0 27px,var(--grid) 27px 29px),
    linear-gradient(170deg,#fff6fa 0%,#fdf3ff 55%,#f4f6ff 100%);
  background-attachment:fixed;
  font-family:"Yuanti SC","YuanTi SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Maru Gothic ProN","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
  padding-bottom:calc(94px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
h1{margin:0;font-weight:700}
.hide{display:none!important}
::-webkit-scrollbar{display:none}

/* ───── 顶栏 ───── */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(255,246,250,.95) 60%,rgba(255,246,250,.7));
  backdrop-filter:blur(12px) saturate(180%);-webkit-backdrop-filter:blur(12px) saturate(180%);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 6px;
}
.hrow{display:flex;align-items:center;gap:10px;max-width:660px;margin:0 auto}
.hcats{display:flex;flex:0 0 auto}
.hcats img{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:#fff;box-shadow:0 2px 9px rgba(220,140,170,.3)}
.hcats img:last-child{margin-left:-13px}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:21px;letter-spacing:-.2px;line-height:1.25}
.htxt .sub{font-size:12px;color:var(--ink2)}
.dice{
  flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#fff;
  box-shadow:0 4px 13px rgba(255,150,180,.28);font-size:19px;line-height:42px;text-align:center;
  transition:transform .15s;
}
.dice:active{transform:scale(.88) rotate(20deg)}

.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 18px 5px;max-width:660px;margin:0 auto}
.filters button{
  flex:0 0 auto;padding:6px 14px;border-radius:20px;background:#fff;
  font-size:13px;font-weight:600;color:var(--ink2);box-shadow:0 2px 8px rgba(255,150,180,.14);
  transition:all .15s;
}
.filters button.on{background:var(--hot);color:#fff;box-shadow:0 4px 12px rgba(255,140,175,.4)}

main{padding:8px 16px 0;max-width:660px;margin:0 auto}
.sect{display:flex;align-items:baseline;gap:7px;margin:20px 0 10px}
.sect .t{font-size:16px;font-weight:700}
.sect .n{font-size:12px;color:var(--ink3)}
.empty{text-align:center;color:var(--ink2);padding:44px 20px;font-size:14px;line-height:1.9}
.empty img{width:98px;height:98px;border-radius:50%;border:3px solid #fff;box-shadow:var(--sh2);margin-bottom:12px}

/* ───── 招牌横滑 ───── */
.signrow{display:flex;gap:11px;overflow-x:auto;padding:3px 3px 10px;scroll-snap-type:x mandatory}
.sign{
  flex:0 0 132px;scroll-snap-align:start;background:var(--card);border-radius:22px;
  box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .14s;
}
.sign:active{transform:scale(.96)}
.sign .p{height:92px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:34px}
.sign .b{padding:7px 10px 9px}
.sign .b .n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sign .b .p2{font-size:11px;letter-spacing:-1px}

/* ───── 菜品网格 ───── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
body{overflow-x:hidden}
.dish{
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;position:relative;cursor:pointer;transition:transform .14s;
}
.dish:active{transform:scale(.965)}
.dish.want::after{content:"";position:absolute;inset:5px;border:2px dashed #ffc4d6;border-radius:21px;pointer-events:none}
.dish .pic{
  aspect-ratio:1/1;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;
}
.s-zhe{background-color:var(--blue)}
.s-me{background-color:var(--pink)}
.s-delivery{background-color:var(--cream)}
.s-restaurant{background-color:var(--apricot)}
.s-drink{background-color:#ece2f7}
.dish .bd{padding:9px 12px 12px}
.dish .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.dish .mt{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.paws{font-size:11px;letter-spacing:-1.5px;margin-top:3px;height:17px}
.badge{
  position:absolute;top:8px;left:8px;background:#fff;border-radius:20px;
  font-size:10.5px;font-weight:700;padding:2px 9px;box-shadow:0 2px 7px rgba(220,140,170,.24);
}
.heart{position:absolute;top:7px;right:9px;font-size:17px;filter:drop-shadow(0 2px 3px rgba(200,100,130,.3))}
.plus{
  position:absolute;right:9px;bottom:9px;width:33px;height:33px;border-radius:50%;
  background:#fff;color:var(--hot2);font-size:19px;line-height:31px;text-align:center;
  box-shadow:0 3px 10px rgba(255,140,175,.35);z-index:2;transition:all .16s;font-weight:700;
}
.plus.in{background:var(--hot);color:#fff;transform:rotate(135deg)}
.plus:active{transform:scale(.85)}

/* ───── FAB / 底栏 ───── */
.fab{
  position:fixed;right:17px;bottom:calc(env(safe-area-inset-bottom) + 82px);z-index:31;
  width:58px;height:58px;border-radius:50%;background:linear-gradient(160deg,#ffadc4,#ff8bab);
  font-size:30px;line-height:56px;text-align:center;color:#fff;font-weight:700;
  box-shadow:0 8px 20px rgba(255,130,170,.48);transition:transform .14s;
}
.fab:active{transform:scale(.9)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,252,254,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shup);
  padding:9px 0 calc(env(safe-area-inset-bottom) + 7px);display:flex;justify-content:space-around;
}
nav b{display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600;font-size:10.5px;color:var(--ink3);padding:2px 16px;position:relative;cursor:pointer}
nav b i{font-size:20px;font-style:normal;filter:grayscale(1) opacity(.38);transition:filter .15s}
nav b img{width:22px;height:22px;border-radius:50%;filter:grayscale(1) opacity(.42)}
nav b.on{color:var(--hot2);font-weight:700}
nav b.on i,nav b.on img{filter:none}
nav .dot{position:absolute;top:-1px;right:8px;min-width:18px;height:18px;border-radius:20px;background:var(--hot);color:#fff;font-size:10px;line-height:18px;text-align:center;padding:0 4px;box-shadow:0 2px 6px rgba(255,130,170,.5)}

/* ───── 弹层 ───── */
.mask{position:fixed;inset:0;background:rgba(90,60,75,.36);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:linear-gradient(175deg,#fff8fb 0%,#fdf5ff 60%,#f7f7ff 100%);
  border-radius:30px 30px 0 0;max-height:93vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(200,130,165,.22);
  transform:translateY(101%);transition:transform .32s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.shead{padding:14px 18px 12px;display:flex;align-items:center;gap:10px}
.shead .ti{flex:1;font-weight:700;font-size:17px;text-align:center}
.shead button{font-size:14.5px;color:var(--ink2);min-width:46px;font-weight:600}
.shead button.pri{color:var(--hot2);font-weight:700;text-align:right}
.sbody{padding:6px 18px calc(env(safe-area-inset-bottom) + 30px);overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ───── 表单 ───── */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{padding:11px 4px;border-radius:18px;background:#fff;font-size:13px;font-weight:700;color:var(--ink2);box-shadow:0 2px 8px rgba(255,150,180,.13);transition:all .15s}
.seg button.on{color:var(--ink);box-shadow:0 4px 13px rgba(255,150,180,.3)}
.seg button.on[data-s=zhe]{background:var(--blue)}
.seg button.on[data-s=me]{background:var(--pink)}
.seg button.on[data-s=delivery]{background:var(--cream)}
.seg button.on[data-s=restaurant]{background:var(--apricot)}
.seg button.on[data-s=drink]{background:#ece2f7}
.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.stg{display:flex;gap:8px;margin-bottom:15px}
.stg button{flex:1;padding:11px;border-radius:18px;background:#fff;font-size:13px;font-weight:700;color:var(--ink2);box-shadow:0 2px 8px rgba(255,150,180,.13)}
.stg button.on{background:var(--hot);color:#fff;box-shadow:0 4px 13px rgba(255,140,175,.35)}
.f{margin-bottom:13px}
.f label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px;font-weight:700;padding-left:4px}
.f input,.f textarea,.f select{
  width:100%;background:#fff;border:0;border-radius:18px;padding:12px 15px;outline:none;
  box-shadow:0 2px 8px rgba(255,150,180,.13);transition:box-shadow .15s;
}
.f textarea{resize:none;min-height:64px;line-height:1.55}
.f input:focus,.f textarea:focus,.f select:focus{box-shadow:0 0 0 2.5px var(--hot),0 4px 12px rgba(255,150,180,.22)}
.f2{display:flex;gap:10px}.f2>.f{flex:1;min-width:0}
.photo{
  height:170px;border-radius:24px;background:#fff;box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink3);font-size:13px;margin-bottom:15px;background-size:cover;background-position:center;
  overflow:hidden;position:relative;font-weight:600;
}
.photo:not(.has)::after{content:"";position:absolute;inset:8px;border:2px dashed #ffd0de;border-radius:18px}
.photo .ph{font-size:32px}
.photo .x{position:absolute;top:9px;right:9px;background:#fff;color:var(--ink);width:29px;height:29px;border-radius:50%;font-size:15px;line-height:29px;text-align:center;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2}
.pawpick{display:flex;gap:5px;align-items:center;background:#fff;border-radius:18px;padding:9px 13px;box-shadow:0 2px 8px rgba(255,150,180,.13)}
.pawpick button{font-size:26px;line-height:1;filter:grayscale(1) opacity(.25);transition:all .14s}
.pawpick button.on{filter:none;transform:scale(1.1)}
.pawpick .z{font-size:12px;color:var(--ink3);margin-left:6px;font-weight:600}
.tagpick{display:flex;flex-wrap:wrap;gap:7px}
.tagpick button{padding:7px 13px;border-radius:20px;background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:0 2px 7px rgba(255,150,180,.13)}
.tagpick button.on{background:var(--hot);color:#fff;box-shadow:0 3px 10px rgba(255,140,175,.34)}
.togg{width:100%;padding:12px;border-radius:18px;background:#fff;color:var(--ink2);font-size:13.5px;font-weight:700;box-shadow:0 2px 8px rgba(255,150,180,.13)}
.togg.on{background:var(--hot);color:#fff;box-shadow:0 4px 13px rgba(255,140,175,.34)}

/* ───── 详情 ───── */
.vpic{aspect-ratio:1/1;width:100%;border-radius:24px;box-shadow:var(--sh2);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:62px;margin-bottom:15px}
.vh{display:flex;align-items:center;gap:9px}
.vh .n{font-size:23px;font-weight:700;flex:1;min-width:0}
.vmeta{color:var(--ink2);font-size:13px;margin:3px 0 8px}
.vpaws{font-size:19px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips span{background:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;box-shadow:0 2px 7px rgba(255,150,180,.13)}
.blk{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.blk .bl{font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:5px}
.blk .bv{white-space:pre-wrap;word-break:break-word}
.kv{display:flex;padding:9px 0;border-bottom:1.5px dashed #f6dde6;font-size:14px;gap:12px}
.kv:last-child{border:0;padding-bottom:0}
.kv .k{color:var(--ink2);flex:0 0 66px;font-size:12.5px;font-weight:600}
.kv .v{flex:1;min-width:0;word-break:break-word}
.logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1.5px dashed #f6dde6}
.logitem:last-child{border:0;padding-bottom:2px}
.logitem .li{width:54px;height:54px;flex:0 0 auto;border-radius:16px;background-size:cover;background-position:center;background-color:var(--pink);box-shadow:0 2px 8px rgba(255,150,180,.2)}
.logitem .lc{flex:1;min-width:0}
.logitem .ld{font-size:11.5px;color:var(--ink3);font-weight:600}
.logitem .lt{white-space:pre-wrap;word-break:break-word;font-size:14px}
.logitem .lx{color:var(--ink3);font-size:16px;padding:0 2px;align-self:flex-start}
.addlog{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.addlog textarea{flex:1;min-height:44px;background:#fff9fb;border:0;border-radius:16px;padding:10px 13px;outline:none;resize:none;box-shadow:inset 0 0 0 1.5px #ffe3ec}
.addlog .cam{width:44px;height:44px;flex:0 0 auto;border-radius:16px;background:#fff9fb center/cover;font-size:19px;line-height:44px;text-align:center;box-shadow:inset 0 0 0 1.5px #ffe3ec}
.addlog .go{flex:0 0 auto;background:var(--hot);color:#fff;border-radius:16px;padding:11px 16px;font-weight:700;box-shadow:0 3px 10px rgba(255,140,175,.35)}
.bigbtn{width:100%;padding:15px;border-radius:22px;font-size:15px;font-weight:700;margin-bottom:11px;background:#fff;box-shadow:var(--sh);transition:transform .14s}
.bigbtn.pink{background:linear-gradient(160deg,#ffadc4,#ff8bab);color:#fff;box-shadow:0 6px 18px rgba(255,130,170,.42)}
.bigbtn.blue{background:linear-gradient(160deg,#bcd9fb,#93bff0);color:#fff;box-shadow:0 6px 18px rgba(130,170,230,.4)}
.bigbtn:active{transform:scale(.975)}
.danger{width:100%;padding:12px;border-radius:18px;background:transparent;color:#dd8fa5;font-size:13.5px;font-weight:600;margin-top:8px}

/* ───── 点单 / 小票 ───── */
.cartitem{display:flex;align-items:center;gap:11px;background:#fff;border-radius:22px;padding:11px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.cartitem .ci{width:48px;height:48px;flex:0 0 auto;border-radius:16px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:22px}
.cartitem .cn{flex:1;min-width:0}
.cartitem .cn b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartitem .cn small{color:var(--ink3);font-size:11.5px}
.cartitem .cx{color:var(--ink3);font-size:20px;padding:0 3px}

.receipt{
  background:#fffdfe;padding:24px 21px 19px;position:relative;border-radius:3px;
  box-shadow:0 8px 26px rgba(200,130,165,.24);
}
.receipt::before,.receipt::after{
  content:"";position:absolute;left:0;right:0;height:9px;
  background:radial-gradient(circle at 5px 0,transparent 5px,#fffdfe 5px);background-size:10px 9px;
}
.receipt::before{top:-8px;transform:rotate(180deg)}
.receipt::after{bottom:-8px}
.rc-h{text-align:center;border-bottom:2px dashed #f3d7e2;padding-bottom:14px}
.rc-h .cats{display:flex;justify-content:center;margin-bottom:8px}
.rc-h .cats img{width:46px;height:46px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 9px rgba(220,140,170,.3)}
.rc-h .cats img:last-child{margin-left:-15px}
.rc-h .tt{font-size:20px;font-weight:700;letter-spacing:2px}
.rc-h .ss{font-size:10.5px;color:var(--ink2);letter-spacing:1.5px;margin-top:2px}
.rc-info{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);padding:10px 0;border-bottom:2px dashed #f3d7e2;gap:6px}
.rc-li{display:flex;align-items:baseline;gap:8px;padding:9px 0;font-size:15px}
.rc-li .no{color:var(--ink3);font-size:12px;width:18px;flex:0 0 auto}
.rc-li .nm{flex:0 0 auto;font-weight:700}
.rc-li .dots{flex:1;border-bottom:1.5px dotted #eccddb;transform:translateY(-4px)}
.rc-li .pw{flex:0 0 auto;font-size:11px;letter-spacing:-2px}
.rc-msg{border-top:2px dashed #f3d7e2;margin-top:6px;padding-top:13px;font-size:13.5px;line-height:1.7}
.rc-msg .l{font-size:11px;color:var(--ink2);font-weight:700}
.rc-foot{text-align:center;padding-top:17px;margin-top:13px;border-top:2px dashed #f3d7e2;position:relative}
.rc-foot .th{font-size:12px;color:var(--ink2);letter-spacing:1.5px}
.stamp{
  position:absolute;right:0;top:-8px;width:78px;height:78px;border-radius:50%;
  border:2.5px solid #ffb3c8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-14deg);opacity:.92;background:rgba(255,255,255,.55);
}
.stamp img{width:39px;height:39px;border-radius:50%}
.stamp small{font-size:8px;color:#f28aa8;font-weight:700;letter-spacing:.5px;line-height:1.2;margin-top:1px}
.order{background:#fff;border-radius:22px;padding:13px 15px;margin-bottom:11px;box-shadow:var(--sh);cursor:pointer}
.order .od{font-size:11.5px;color:var(--ink3);font-weight:600}
.order .on2{font-weight:700;margin-top:2px}

/* ───── 小窝 ───── */
.hero{text-align:center;padding:8px 0 18px}
.hero .cc{display:flex;justify-content:center;margin-bottom:10px}
.hero .cc img{width:90px;height:90px;border-radius:50%;border:3.5px solid #fff;box-shadow:var(--sh2)}
.hero .cc img:last-child{margin-left:-24px}
.hero .nm{font-size:19px;font-weight:700}
.hero .ds{font-size:12.5px;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:14px}
.tile{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:15px 12px;text-align:center}
.tile .v{font-size:27px;font-weight:700;line-height:1.2;color:var(--hot2)}
.tile .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed #f6dde6}
.rank:last-child{border:0;padding-bottom:0}
.rank .i{width:20px;color:var(--ink3);font-size:12.5px;font-weight:700}
.rank .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rank .v{color:var(--ink3);font-size:11px;letter-spacing:-1.5px}

/* ───── 摇一摇 ───── */
.rollbox{text-align:center;padding:8px 0 4px}
.rollbox .rimg{width:114px;height:114px;border-radius:50%;border:3.5px solid #fff;box-shadow:var(--sh2);margin-bottom:13px;animation:bob 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.rollbox .say{font-size:14px;color:var(--ink2);margin-bottom:14px;font-weight:600}
.rollbox .big{font-size:31px;font-weight:700;margin-bottom:4px}

.crop{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:24px;
  background:#f7eef3;touch-action:none;box-shadow:var(--sh2);cursor:grab}

<div class="toast" id="toast"></div>

<script>
/* ══════════════ 存储 ══════════════ */
const K='ss.dishes.v3', KSH='ss.shops.v3', KOLD='ss.dishes.v2';
const KC='ss.cart.v2', KO='ss.orders.v2', KS='ss.set.v2';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const uid=()=>'d'+Math.random().toString(36).slice(2,9);
const sid=()=>'sh'+Math.random().toString(36).slice(2,9);
const ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const today=()=>new Date().toISOString().slice(0,10);

const SRC={
  zhe:{n:'哲大厨',e:'👨‍🍳'}, me:{n:'兔老板',e:'🐰'},
  delivery:{n:'外卖',e:'🛵'}, restaurant:{n:'馆子',e:'🍽️'}, drink:{n:'奶茶',e:'🧋'},
};
const BUILD='0830-2106';
const DRINKTAGS=['🧋 珍珠','🥥 椰果','🌾 燕麦奶','🍵 茶味重','🥛 奶味重','🍨 冰沙','🍬 少糖','🍬 三分糖','🍬 五分糖','🍬 七分糖','🍬 全糖','🚫 无糖','❄️ 去冰','🧊 少冰','🧊 正常冰','🌡️ 常温','🔥 热'];
const TAGS=['🌶️ 辣','🥬 清淡','🍲 汤','🍜 面','🍚 饭','🥩 硬菜','🐟 海鲜','⚡ 快手','🍰 甜','🧊 凉菜'];

/* 不塞示范数据:第一次打开就是空的,东西都由她自己录 */
const SEED=[], SEEDSHOPS=[];

/* ── 读数据 + 从 v2 迁移(旧键原样留着当备份,永远不写它) ── */
let dishes=ld(K,null), shops=ld(KSH,null);
if(dishes===null){
  const old=ld(KOLD,null);
  if(old&&old.length){                      // 她已经在用了 → 迁移,一道菜都不能丢
    dishes=old.map(d=>({...d}));
    shops=[];
    dishes.forEach(d=>{
      if(d.src==='bf')d.src='zhe';
      if((d.src==='delivery'||d.src==='restaurant')&&d.shop){
        let s=shops.find(x=>x.name===d.shop&&x.kind===d.src);
        if(!s){s={id:sid(),name:d.shop,kind:d.src,memo:'',avg:+d.price||0,warn:'',visits:[],at:today()};shops.push(s)}
        d.shopId=s.id;
      }else d.shopId='';
    });
  }else{                                    // 全新 → 用示范数据
    dishes=SEED.map((d,i)=>({id:'s'+i,at:today(),logs:[],...d}));
    shops=SEEDSHOPS.map(s=>({at:today(),...s}));
  }
  sv(K,dishes);sv(KSH,shops);
}
if(shops===null){shops=[];sv(KSH,shops)}
dishes.forEach(d=>{if(d.src==='bf')d.src='zhe';if(d.shopId===undefined)d.shopId=''});
shops.forEach(s=>{if(!Array.isArray(s.visits))s.visits=[]});
let cart=ld(KC,[]), orders=ld(KO,[]), stg=ld(KS,{me:'兔老板',chef:'哲哲'});
if(!stg.chef||stg.chef==='大厨')stg.chef='哲哲';
if(!stg.me||stg.me==='七七七')stg.me='兔老板';
const persist=()=>{
  const ok=[sv(K,dishes),sv(KSH,shops),sv(KC,cart),sv(KO,orders),sv(KS,stg)].every(Boolean);
  if(!ok)toast('⚠️ 存不下了!照片太多,去小窝看看');
  return ok;
};
const usedKB=()=>{try{return Math.round([K,KSH,KC,KO,KS].reduce((n,k)=>n+((localStorage.getItem(k)||'').length),0)/1024)}catch{return 0}};

/* ══════════════ 工具 ══════════════ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paw=n=>n?'🐾'.repeat(n):'';
/* ══ 照片库:放 IndexedDB(几百 MB),localStorage 里只留一个 id ══ */
let _db=null;
const idb=()=>new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open('meishaotu',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('pics'))r.result.createObjectStore('pics')};
  r.onsuccess=()=>{_db=r.result;res(_db)};
  r.onerror=()=>rej(r.error);
});
const picPut=(id,blob)=>idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('pics','readwrite');t.objectStore('pics').put(blob,id);
  t.oncomplete=()=>res(id);t.onerror=()=>rej(t.error);
}));
const picAll=()=>idb().then(db=>new Promise((res,rej)=>{
  const out={},c=db.transaction('pics','readonly').objectStore('pics').openCursor();
  c.onsuccess=e=>{const q=e.target.result;if(q){out[q.key]=q.value;q.continue()}else res(out)};
  c.onerror=()=>rej(c.error);
}));
const PIC={}, PICB={};      // id -> blob URL / blob 本体
const picURL=v=>!v?'':(String(v).startsWith('p:')?(PIC[v]||''):v);
/* Safari 的 fetch() 读不了 data: URL,手工解码 */
function dataURLtoBlob(u){
  const i=u.indexOf(','), head=u.slice(0,i), body=u.slice(i+1);
  const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(body), arr=new Uint8Array(bin.length);
  for(let n=0;n<bin.length;n++)arr[n]=bin.charCodeAt(n);
  return new Blob([arr],{type:mime});
}
async function savePic(dataURL){
  const id='p:'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  const b=dataURLtoBlob(dataURL);
  await picPut(id,b); PICB[id]=b; PIC[id]=URL.createObjectURL(b); return id;
}
/* 数据里一共引用了多少张照片(用来跟图库对账) */
const refPics=()=>{
  const a=[];
  dishes.forEach(d=>{ if(d.cover)a.push(d.cover); (d.logs||[]).forEach(l=>{if(l.photo)a.push(l.photo)}) });
  shops.forEach(x=>{ if(x.cover)a.push(x.cover) });
  return a;
};
const asB64=v=>{
  if(!v)return Promise.resolve('');
  if(!String(v).startsWith('p:'))return Promise.resolve(v);
  if(!PICB[v])return Promise.resolve('');
  return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(PICB[v])});
};
/* 老数据里的 base64 一次性搬进图库 */
async function movePics(){
  let ok=0, bad=0;
  const mv=async v=>{
    if(!v||!String(v).startsWith('data:'))return v;
    try{ const id=await savePic(v); ok++; return id }catch(e){ bad++; return v }   // 搬不动就留着,不能弄丢
  };
  for(const d of dishes){ d.cover=await mv(d.cover);
    for(const l of (d.logs||[])) l.photo=await mv(l.photo); }
  for(const x of shops) x.cover=await mv(x.cover);
  if(ok||bad){
    persist(); render();
    toast(bad? `搬了 ${ok} 张,有 ${bad} 张没搬动 😖` : `把 ${ok} 张照片挪到大仓库了 📦`);
  }
}
const pic=d=>{const u=picURL(d.cover);return u?`background-image:url(${u})`:''};
/* 没照片时按菜名自动配个图标,不然同一个人做的菜长得一模一样 */
const ICONS=[
 [/火锅/,'🍲'],[/排骨|肋排/,'🍖'],[/鸡翅|鸡腿|鸡/,'🍗'],[/虾/,'🦐'],[/蟹/,'🦀'],[/鱼/,'🐟'],
 [/蛋/,'🍳'],[/豆腐|豆花/,'🥘'],[/西兰花|青菜|菜心|生菜|白菜|花菜|菠菜|芥兰/,'🥦'],
 [/茄子/,'🍆'],[/土豆|薯/,'🥔'],[/玉米/,'🌽'],[/蘑菇|香菇|菌/,'🍄'],[/南瓜/,'🎃'],
 [/饺|包子|馄饨|烧麦/,'🥟'],[/粉|面|米线/,'🍜'],[/粥/,'🥣'],[/汤|羹/,'🍲'],
 [/沙拉/,'🥗'],[/寿司|刺身/,'🍣'],[/披萨/,'🍕'],[/汉堡/,'🍔'],[/咖喱/,'🍛'],
 [/蛋糕|布丁|甜品|冰淇淋/,'🍰'],[/串|烧烤/,'🍢'],[/牛|猪|羊|肉/,'🥩'],[/番茄|西红柿/,'🍅'],
 [/锅/,'🥘'],[/饭/,'🍚'],
];
function emo(d){
  if(d.cover)return'';
  for(const [re,e] of ICONS) if(re.test(d.name)) return e;
  return SRC[d.src].e;
}

function shopPic(s){
  if(s.cover)return{bg:picURL(s.cover),ico:''};
  const ds=shopDishes(s.id).filter(d=>d.cover).sort((a,b)=>(b.paws||0)-(a.paws||0));
  if(ds.length)return{bg:picURL(ds[0].cover),ico:''};
  const best=shopDishes(s.id).filter(d=>d.st==='done').sort((a,b)=>(b.paws||0)-(a.paws||0))[0];
  return{bg:'',ico:best?emo(best):SRC[s.kind].e};
}
/* 卡面只留店名 + 一行,人均/上次/避雷都在店详情里 */
function shopCard(s){

  const line = must ? '⭐ '+must.name
             : s.visits.length ? `去过 ${s.visits.length} 次`
             : '还没去过';

  return `<div class="dish" data-s="${s.id}">
    <div class="pic s-${s.kind}" style="${bg?`background-image:url(${bg})`:''}">${ico}
      <span class="srctag">${SRC[s.kind].e} ${SRC[s.kind].n}</span>

  /* 合并导入:文件和「网上拉」共用 */
  function importData(j){
    if(!j||!Array.isArray(j.dishes))throw 0;
        const nd=j.dishes.length, ns=(j.shops||[]).length;
    const merge = dishes.length||shops.length
      ? confirm(`这份数据:菜 ${nd} 道 · 店 ${ns} 家\n\n【确定】= 并到现在的数据里(推荐)\n【取消】= 先别导,我再想想`)
      : true;
    if(!merge)return;
    if(dishes.length||shops.length){
      /* 合并:同名同类的店算一家,访问日期去重;同名同来源的菜不重复加 */
      const key=x=>(x.name||'').trim()+'|'+x.kind;
      const map=new Map(shops.map(x=>[key(x),x]));
      const idmap={};
      (j.shops||[]).forEach(ns2=>{
        const hit=map.get(key(ns2));
        if(hit){
          idmap[ns2.id]=hit.id;
          hit.visits=[...new Set([...(hit.visits||[]),...(ns2.visits||[])])];
          if(!hit.memo&&ns2.memo)hit.memo=ns2.memo;
          if(!hit.warn&&ns2.warn)hit.warn=ns2.warn;
          if(!hit.avg&&ns2.avg)hit.avg=ns2.avg;

        if(have.has(dkey(c)))return;
        have.add(dkey(c)); dishes.push(c);

      orders=[...orders,...(j.orders||[])];

      L.push('② 写一张测试图…');

      catch(e){ L.push('   失败:'+e.name+' '+e.message) }
    }catch(e){ L.push('✗ 出错:'+(e&&(e.name+' / '+e.message)||e)) }
    alert(L.join('\n'));
  };
  $('#hDedup').onclick=()=>{

    dishes=keep;persist();render();toast(`清掉 ${gone} 条 🧹`);
  };

function shrink(file,cb,max=1000,q=.72){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=im.width*s|0;c.height=im.height*s|0;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};
    im.src=r.result};
  r.readAsDataURL(file);
}
/* ── 裁成正方形:拖动挪位置,滑块放大,确认后画到 canvas ── */
const cp={img:null,base:1,zoom:1,x:0,y:0,box:0,cb:null,out:900};
function cpApply(){
  const k=cp.base*cp.zoom, w=cp.img.naturalWidth*k, h=cp.img.naturalHeight*k;
  cp.x=Math.min(0,Math.max(cp.box-w,cp.x));        // 不许露白边
  cp.y=Math.min(0,Math.max(cp.box-h,cp.y));
  $('#cpImg').style.transform=`translate(${cp.x}px,${cp.y}px) scale(${k})`;
}
function openCrop(file,cb,out){
  cp.cb=cb; cp.out=out||900;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      cp.img=im; cp.zoom=1;
      openSheet($('#shCrop'));
      requestAnimationFrame(()=>{
        cp.box=$('#cpBox').clientWidth||320;
        cp.base=Math.max(cp.box/im.naturalWidth, cp.box/im.naturalHeight);   // 先铺满
        const w=im.naturalWidth*cp.base, h=im.naturalHeight*cp.base;
        cp.x=(cp.box-w)/2; cp.y=(cp.box-h)/2;                                 // 居中起步
        const el=$('#cpImg'); el.src=im.src; el.style.width=im.naturalWidth+'px'; el.style.height='auto';
        $('#cpZoom').value=1; cpApply();
      });
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
$('#cpZoom').oninput=e=>{
  const old=cp.base*cp.zoom, mid=cp.box/2;
  cp.zoom=+e.target.value;
  const k=cp.base*cp.zoom, f=k/old;
  cp.x=mid-(mid-cp.x)*f; cp.y=mid-(mid-cp.y)*f;   // 以中心为锚点缩放
  cpApply();
};
(()=>{
  const box=$('#cpBox'); let id=null,sx=0,sy=0,ox=0,oy=0;
  box.addEventListener('pointerdown',e=>{
    if(!cp.img)return; id=e.pointerId; sx=e.clientX; sy=e.clientY; ox=cp.x; oy=cp.y;
    box.setPointerCapture(id);
  });
  box.addEventListener('pointermove',e=>{
    if(id===null||e.pointerId!==id)return;
    cp.x=ox+(e.clientX-sx); cp.y=oy+(e.clientY-sy); cpApply();
  });
  const up=e=>{if(id!==null&&e.pointerId===id){try{box.releasePointerCapture(id)}catch{} id=null}};
  box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
})();
$('#cpOk').onclick=()=>{
  if(!cp.img||!cp.cb)return closeOne($('#shCrop'));
  const k=cp.base*cp.zoom, S=cp.out;
  const c=document.createElement('canvas'); c.width=S; c.height=S;
  c.getContext('2d').drawImage(cp.img, -cp.x/k, -cp.y/k, cp.box/k, cp.box/k, 0, 0, S, S);
  const cb=cp.cb; cp.cb=null; closeOne($('#shCrop')); cb(c.toDataURL('image/jpeg',.72));
};

    if(logPhoto&&!d.cover)d.cover=logPhoto;
    persist();openView(id);render();toast('记上了 ✏️');
  };
  $('#vBody').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    d.logs=d.logs.filter(l=>l.id!==b.dataset.dl);persist();openView(id);
  });
  $('#vDel').onclick=()=>{if(!confirm(`把「${d.name}」从菜单删掉?`))return;
    dishes=dishes.filter(x=>x.id!==id);cart=cart.filter(x=>x!==id);persist();closeSheets();render();toast('删了')};
  openSheet($('#shView'));
}
$('#vEditBtn').onclick=()=>{const id=viewId;closeSheets();setTimeout(()=>openEdit(id),270)};

/* ── 店详情 ── */
let curShop=null;
function openShop(id){
  const s=shopOf(id); if(!s)return; curShop=id;
  const {ds,last}=shopStats(s);
  const sorted=[...ds].sort((a,b)=>(b.paws||0)-(a.paws||0));
  const wants=shopDishes(id).filter(d=>d.st==='want');
  const meta=[s.visits.length?`去过 ${s.visits.length} 次`:'还没去过'];
  if(last)meta.push('上次 '+fmt(last));
  if(s.avg)meta.push('人均 ¥'+s.avg);
  $('#svTitle').textContent=s.name;
  $('#svBody').innerHTML=`
   <div class="vh"><span class="n">${SRC[s.kind].e} ${esc(s.name)}</span></div>
   <div class="vmeta">${esc(meta.join(' · '))}</div>
   ${s.warn?`<div class="blk"><div class="bl">⚠️ 避雷</div><div class="bv">${esc(s.warn)}</div></div>`:''}
   <div class="blk"><div class="bl">📝 下单备注</div>
     <div class="bv">${s.memo?esc(s.memo):'<span style="color:var(--ink3)">还没写。点右上角「改」加一句,下次点的时候照着抄</span>'}</div>
     ${s.memo?`<button class="bigbtn" id="svCopy" style="margin:12px 0 0;padding:11px">📋 复制备注</button>`:''}
   </div>
   <button class="bigbtn pink" id="svVisit">✅ 今天吃了这家</button>
   <div class="f" style="margin:-4px 0 12px">
     <label>补记以前的某一天</label>
     <div style="display:flex;gap:8px;align-items:center">
       <input type="date" id="svBack" max="${today()}" style="flex:1;min-width:0">
       <button class="togg" id="svBackGo" style="width:auto;flex:0 0 auto;padding:12px 16px">补上</button>
     </div>
   </div>
   ${s.visits.length?`<div class="blk"><div class="bl">📅 去过的日子 <span style="font-weight:400">(记错了点 × 删掉)</span></div>
     ${[...s.visits].map((v,i)=>({v,i})).sort((a,b)=>b.v.localeCompare(a.v)).map(({v,i})=>
       `<div class="kv"><span class="v">${fmt(v)}<span style="color:var(--ink3);font-size:11.5px"> ${v}</span></span>
        <button class="lx" data-rmv="${i}" style="color:var(--ink3);font-size:17px">×</button></div>`).join('')}
   </div>`:''}
   <div class="blk"><div class="bl">🍽️ 我们点过的 <span style="font-weight:400">(${ds.length} 道)</span></div>
     ${sorted.length?sorted.map(d=>`<div class="drow" data-d="${d.id}">
        <span class="dp s-${d.src}" style="${pic(d)}">${emo(d)}</span>
        <span class="n">${esc(d.name)}${d.fav?' ❤️':''}${d.note?`<small>${esc(d.note)}</small>`:''}</span>
        <span class="v">${paw(d.paws)||'还没评'}</span></div>`).join('')
      :`<div style="color:var(--ink3);font-size:13px;padding:4px 0">还没记过这家的菜。点了什么好吃的就加一道 🐾</div>`}
     ${wants.length?wants.map(d=>`<div class="drow" data-d="${d.id}">
        <span class="dp s-${d.src}" style="${pic(d)}">${emo(d)}</span>
        <span class="n">🔖 ${esc(d.name)}</span><span class="v">还没点过</span></div>`).join(''):''}
   </div>
   <button class="bigbtn" id="svAdd">＋ 加一道这家的菜</button>
   <button class="danger" id="svDel">删掉这家店</button>`;
  const cp=$('#svCopy');
  if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(s.memo);toast('备注复制好了 📋')}catch{toast('复制失败,自己抄一下 😅')}};
  $('#svVisit').onclick=()=>{s.visits.push(today());persist();render();openShop(id);toast(`记下啦,今天吃了 ${s.name} 🐾`)};
  $('#svBackGo').onclick=()=>{
    const d=$('#svBack').value;
    if(!d){toast('先选个日子 📅');return}
    if(d>today()){toast('还没到那天呢 😅');return}
    s.visits.push(d);persist();render();openShop(id);toast(`补上了:${fmt(d)}吃的 🐾`);
  };
  $('#svBody').querySelectorAll('[data-rmv]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    s.visits.splice(+b.dataset.rmv,1);persist();render();openShop(id);toast('这次去掉了');
  });
  $('#svAdd').onclick=()=>{closeSheets();setTimeout(()=>openEdit(null,{src:s.kind,shop:s.name,price:s.avg}),270)};
  $('#svDel').onclick=()=>{
    const n=shopDishes(id).length;
    if(!confirm(`删掉「${s.name}」?${n?`它下面 ${n} 道菜也会一起没。`:''}`))return;
    dishes=dishes.filter(d=>d.shopId!==id); shops=shops.filter(x=>x.id!==id);
    persist();closeSheets();render();toast('删了');
  };
  $('#svBody').querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{closeSheets();setTimeout(()=>openView(el.dataset.d),270)});
  openSheet($('#shShop'));
}
$('#svEdit').onclick=()=>{const id=curShop;closeSheets();setTimeout(()=>openShopEdit(id),270)};

/* ── 加店 / 改店 ── */
let seId=null, seKind='delivery';
const setSeKind=k=>{seKind=k;$$('#seSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===k))};
$$('#seSeg button').forEach(b=>b.onclick=()=>setSeKind(b.dataset.s));
function openShopEdit(id){
  seId=id; const s=(id&&shopOf(id))||{};
  $('#seTitle').textContent=id?'改这家店':'加一家店';
  setSeKind(s.kind||(fOut==='restaurant'?'restaurant':'delivery'));
  $('#seName').value=s.name||''; $('#seMemo').value=s.memo||'';
  $('#seAvg').value=s.avg||''; $('#seWarn').value=s.warn||'';
  openSheet($('#shShopEdit'));
  if(!id)setTimeout(()=>$('#seName').focus(),340);
}
$('#seSave').onclick=()=>{
  const name=$('#seName').value.trim();
  if(!name){toast('给它起个名先 😅');$('#seName').focus();return}
  const f={name,kind:seKind,memo:$('#seMemo').value.trim(),avg:+$('#seAvg').value||0,warn:$('#seWarn').value.trim()};
  if(seId){
    const s=shopOf(seId); Object.assign(s,f);
    shopDishes(seId).forEach(d=>{d.shop=name;d.src=seKind});   // 菜跟着店走
  }else shops.unshift({id:sid(),...f,visits:[],at:today()});
  persist();closeSheets();render();toast(seId?'改好了 ✏️':'收录了 🛵');
};

/* ── 摇一摇(跟着当前这一格 + 当前筛选走) ── */
const SAYS=['喵~ 我觉得今天该吃这个','闭着眼睛给你挑的','三三也想吃这个','就它了,别纠结啦','十九帮你决定好了'];
function roll(){
  const box=$('#rollBody'), cat=Math.random()<.5?'toshi':'sansan';
  const say=SAYS[Math.floor(Math.random()*SAYS.length)];
  const head=t=>`<div class="rollbox"><img class="rimg" src="img/${cat}-head.png"><div class="say">${t}</div>`;
  const nope=t=>{box.innerHTML=head(t)+'</div>';openSheet($('#shRoll'))};

  if(view==='out'&&fOut==='drink'){
    $('#shRoll .ti').textContent='今天喝哪杯';
    const pool=dishes.filter(d=>d.src==='drink'&&d.st!=='want');
    if(!pool.length)return nope('还没记过奶茶,摇不出来 😿');
    const d=pool[Math.floor(Math.random()*pool.length)];
    box.innerHTML=head(say)+`
       <div class="big">${esc(d.name)}</div>
       <div style="font-size:13px;color:var(--ink2);margin-bottom:8px">${esc([d.shop,d.price?'¥'+d.price:''].filter(Boolean).join(' · ')||'🧋')}</div>
       ${d.tags&&d.tags.length?`<div style="font-size:13px;margin-bottom:6px">${d.tags.map(esc).join('  ')}</div>`:''}
       <div style="font-size:15px;margin-bottom:14px">${paw(d.paws)}</div></div>
     <button class="bigbtn" id="rollOpen">看看这杯</button>`;
    const op=$('#rollOpen'); if(op)op.onclick=()=>{closeSheets();setTimeout(()=>openView(d.id),270)};
    openSheet($('#shRoll'));return;
  }
  if(view==='out'){
    $('#shRoll .ti').textContent=fOut==='restaurant'?'今天去哪家':fOut==='delivery'?'今天点哪家':'今天吃哪家';
    const pool=shops.filter(s=>fOut==='all'||s.kind===fOut);
    if(!pool.length)return nope('这一类还没有店可以摇 😿');
    const s=pool[Math.floor(Math.random()*pool.length)];
    const {must,last}=shopStats(s);
    const line=[];
    if(s.visits.length)line.push(`去过 ${s.visits.length} 次`); if(last)line.push('上次 '+fmt(last));
    if(s.avg)line.push('人均 ¥'+s.avg);
    box.innerHTML=head(say)+`
       <div class="big">${esc(s.name)}</div>
       <div style="font-size:13px;color:var(--ink2);margin-bottom:10px">${SRC[s.kind].e} ${esc(line.join(' · ')||'还没去过')}</div>
       ${must?`<div style="font-size:14px;margin-bottom:4px">⭐ 必点 ${esc(must.name)} ${paw(must.paws)}</div>`:''}
       ${s.memo?`<div style="font-size:13px;color:var(--ink2);margin-bottom:4px">📝 ${esc(s.memo)}</div>`:''}
       ${s.warn?`<div style="font-size:13px;color:#d9866f;margin-bottom:4px">⚠️ ${esc(s.warn)}</div>`:''}
       <div style="height:14px"></div></div>
     <button class="bigbtn pink" id="rollGo">✅ 就它了</button>
     <button class="bigbtn" id="rollOpen">看看这家</button>`;
    $('#rollGo').onclick=()=>{s.visits.push(today());persist();render();closeSheets();toast(`记下啦,今天吃 ${s.name} 🐾`)};
    $('#rollOpen').onclick=()=>{closeSheets();setTimeout(()=>openShop(s.id),270)};
  }else{
    $('#shRoll .ti').textContent='今天让他做啥';
    const pool=dishes.filter(d=>homemade(d)&&d.st==='done'&&(fKit==='all'||fKit==='want'||d.src===fKit));
    if(!pool.length)return nope('厨房里还没菜可以摇 😿');
    const d=pool[Math.floor(Math.random()*pool.length)];
    box.innerHTML=head(say)+`
       <div class="big">${esc(d.name)}</div>
       <div style="font-size:13px;color:var(--ink2);margin-bottom:4px">${SRC[d.src].e} ${esc(nameOf(d.src))}${d.note?' · '+esc(d.note):''}</div>
       <div style="font-size:15px;margin-bottom:16px">${paw(d.paws)}</div></div>
     <button class="bigbtn pink" id="rollAdd">＋ 就它了,加进点单</button>`;
    $('#rollAdd').onclick=()=>{if(!cart.includes(d.id)){cart.push(d.id);persist();render()}closeSheets();toast(`「${d.name}」加进点单了 🐾`)};
  }
  openSheet($('#shRoll'));
}
$('#dice').onclick=roll; $('#rollAgain').onclick=roll;

/* ══════════════ 启动 ══════════════ */
$$('nav b').forEach(b=>b.onclick=()=>{view=b.dataset.v;scrollTo(0,0);render()});
$('#cartBar').onclick=openOrder;
persist(); render();

/* 离线缓存:装一次,以后 github 连不上也能开 */
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
